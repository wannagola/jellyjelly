<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="젤리젤리">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDEFF4"/>
      <stop offset="1" stop-color="#FAE0EA"/>
    </linearGradient>
    <linearGradient id="glass" x1=".12" y1="0" x2=".88" y2="1">
      <stop offset="0" stop-color="#FBFDFE"/>
      <stop offset=".5" stop-color="#F1F6FA"/>
      <stop offset="1" stop-color="#E7EFF6"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0C3D2"/>
      <stop offset="1" stop-color="#DD9EB4"/>
    </linearGradient>
    <!-- 병 안쪽. 알맹이가 유리 밖으로 삐져나오지 않게 -->
    <clipPath id="inside">
      <rect x="27" y="37" width="66" height="68" rx="19"/>
    </clipPath>
  </defs>

  <rect width="120" height="120" rx="27" fill="url(#plate)"/>

  <!-- 뚜껑 -->
  <rect x="43" y="30" width="34" height="9" rx="2.5" fill="#F3D3DF"/>
  <rect x="35" y="19" width="50" height="14" rx="5.5" fill="url(#lid)"/>
  <rect x="40" y="22.5" width="40" height="3.4" rx="1.7" fill="#FFFFFF" opacity=".48"/>

  <!-- 유리병 -->
  <rect x="27" y="37" width="66" height="68" rx="19" fill="url(#glass)"/>

  <!-- 알맹이는 바닥부터 쌓인다 -->
  <g clip-path="url(#inside)">
    <g transform="translate(28 79) scale(1.08) rotate(-9 12 12)" fill="#8E5BC9">
      <circle cx="6.6" cy="5.4" r="2.5"/><circle cx="17.4" cy="5.4" r="2.5"/>
      <path d="M12 4.6c-3.5 0-5.9 2.6-5.9 6 0 1.7.5 2.7.5 4 0 1.3-.9 1.8-.9 3.3 0 1.9 1.7 3.1 3.4 3.1 1.2 0 1.9-.6 2.9-.6s1.7.6 2.9.6c1.7 0 3.4-1.2 3.4-3.1 0-1.5-.9-2-.9-3.3 0-1.3.5-2.3.5-4 0-3.4-2.4-6-5.9-6z"/>
      <circle cx="9.6" cy="10.3" r="1.05" fill="rgba(255,255,255,.55)"/>
      <circle cx="14.4" cy="10.3" r="1.05" fill="rgba(255,255,255,.55)"/>
    </g>
    <g transform="translate(50 82) scale(1.02) rotate(10 12 12)">
      <circle cx="12" cy="12" r="7.4" fill="none" stroke="#EF5D7A" stroke-width="5.2"/>
    </g>
    <g transform="translate(69 84) scale(.88) rotate(-16 12 12)" fill="#EFC93C">
      <rect x="3.6" y="3.6" width="16.8" height="16.8" rx="4.6"/>
      <rect x="6.4" y="6.4" width="5.4" height="4.4" rx="2" fill="rgba(255,255,255,.4)"/>
    </g>

    <g transform="translate(34 61) scale(.9) rotate(-13 12 12)" fill="#5BB8E0">
      <rect x="3.6" y="3.6" width="16.8" height="16.8" rx="4.6"/>
      <rect x="6.4" y="6.4" width="5.4" height="4.4" rx="2" fill="rgba(255,255,255,.4)"/>
    </g>
    <g transform="translate(52 62) scale(.98) rotate(7 12 12)">
      <g fill="none" stroke="#7CC36A" stroke-width="4.6" stroke-linecap="round">
        <path d="M4.4 17.8c0-3 3.5-3 3.5-6s-3.5-3-3.5-6"/>
        <path d="M11.4 17.8c0-3 3.5-3 3.5-6s-3.5-3-3.5-6" opacity=".82"/>
        <path d="M18.4 17.8c0-3 1.4-3.6 1.4-5.8" opacity=".64"/>
      </g>
    </g>

    <g transform="translate(44 45) scale(.88) rotate(-5 12 12)" fill="#F59940">
      <path d="M12 20.6S2.8 14.9 2.8 8.9c0-3.1 2.4-5.3 5.1-5.3 2 0 3.3 1.1 4.1 2.3.8-1.2 2.1-2.3 4.1-2.3 2.7 0 5.1 2.2 5.1 5.3 0 6-9.2 11.7-9.2 11.7z"/>
      <ellipse cx="8.5" cy="8.6" rx="1.5" ry="1.1" fill="rgba(255,255,255,.45)" transform="rotate(-28 8.5 8.6)"/>
    </g>
  </g>

  <!-- 유리 반사 — 알맹이보다 위에 와야 '병 안'으로 보인다 -->
  <rect x="34" y="46" width="5.2" height="32" rx="2.6" fill="#FFFFFF" opacity=".92"/>
  <rect x="43" y="46" width="2.8" height="17" rx="1.4" fill="#FFFFFF" opacity=".7"/>
  <rect x="27.8" y="37.8" width="64.4" height="66.4" rx="18.2" fill="none" stroke="#FFFFFF" stroke-opacity=".9" stroke-width="1.6"/>
</svg>
